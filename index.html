["فسّر: يمكن أن تكون طريقة المصادقة قوية أمنيًا لكنها غير مناسبة لبعض المستخدمين.","لأن تقييم طريقة المصادقة لا يعتمد على الأمان فقط، بل يجب مراعاة إمكانية الوصول وسهولة الاستخدام، مثل حالة مستخدم لا يملك هاتفًا ذكيًا.","تفكير","Accessibility"],

let active="الكل",query="";
const labels={"مقالي":"✍️ الأسئلة المقالية","اختيار من متعدد":"🧠 اختيار من متعدد (MCQ)","صح / خطأ":"✓ صح / خطأ","أكمل":"⌨️ أكمل","مصطلح علمي":"📘 المصطلح العلمي","علّل / فسّر":"❓ علّل / فسّر","مواقف تطبيقية":"🎯 مواقف تطبيقية"};
function allCount(){return Object.values(data).reduce((s,a)=>s+a.length,0)}
function tagClass(x){return x==="أساسي"?'basic':x==="متوسط"?'medium':x==="تفكير"?'think':x==="Trap"?'trap':x==="متوقع جدًا"?'likely':''}
function matches(item,type){return !query||JSON.stringify(item).toLowerCase().includes(query.toLowerCase())}
function renderTabs(){let h=`<button class="tab ${active==='الكل'?'active':''}" onclick="setTab('الكل')">الكل <small>(${allCount()})</small></button>`;for(const k of Object.keys(data))h+=`<button class="tab ${active===k?'active':''}" onclick="setTab('${k}')">${labels[k]} <small>(${data[k].length})</small></button>`;document.getElementById('tabs').innerHTML=h}
function meta(level,idea){return `<div class="meta"><span class="tag ${tagClass(level)}">${level}</span><span class="tag">الفكرة: ${idea}</span></div>`}
function cardEssay(i,x,type){return `<article class="card searchable">${meta(x[2],x[3])}<div class="q">${i+1}. ${x[0]}</div><button class="reveal" onclick="toggle(this)">إظهار الإجابة</button><div class="answer"><strong>الإجابة النموذجية:</strong><br>${x[1]}</div></article>`}
function cardMCQ(i,x){let opts=x[1].map((o,j)=>`<button class="choice" data-correct="${j===x[2]}" onclick="mcq(this)">${String.fromCharCode(65+j)}- ${o}</button>`).join('');return `<article class="card searchable">${meta(x[3],x[4])}<div class="q">${i+1}. ${x[0]}</div><div class="choices">${opts}</div><div class="feedback"></div><div class="answer"><strong>الإجابة الصحيحة:</strong> ${x[1][x[2]]}</div></article>`}
function cardTF(i,x){return `<article class="card searchable">${meta(x[2],x[3])}<div class="q">${i+1}. ${x[0]}</div><button class="reveal" onclick="toggle(this)">إظهار الإجابة</button><div class="answer"><strong>الإجابة:</strong> ${x[1]?'صح':'خطأ'}<div class="why">${x[1]?'العبارة متوافقة مع مفاهيم الدرس.':'العبارة غير صحيحة؛ انتبه للتمييز بين المفاهيم كما ورد في الدرس.'}</div></div></article>`}
function cardComplete(i,x){return `<article class="card searchable">${meta(x[2],x[3])}<div class="q">${i+1}. ${x[0]}</div><button class="reveal" onclick="toggle(this)">إظهار الإجابة</button><div class="answer"><strong>الإجابة:</strong> ${x[1]}</div></article>`}
function render(){let root=document.getElementById('content');root.innerHTML='';let types=active==='الكل'?Object.keys(data):[active];let totalShown=0;for(const type of types){let arr=data[type].filter(x=>matches(x,type));if(!arr.length)continue;totalShown+=arr.length;let sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="section-title"><h2>${labels[type]}</h2><span class="count">${arr.length} سؤال</span></div>`;arr.forEach((x,i)=>{let html=type==='مقالي'||type==='علّل / فسّر'||type==='مواقف تطبيقية'?cardEssay(i,x,type):type==='اختيار من متعدد'?cardMCQ(i,x):type==='صح / خطأ'?cardTF(i,x):type==='أكمل'?cardComplete(i,x):cardEssay(i,x,type);sec.insertAdjacentHTML('beforeend',html)});root.appendChild(sec)}if(!totalShown)root.innerHTML='<div class="empty">لا توجد نتائج مطابقة لبحثك.</div>'}
function toggle(btn){let a=btn.nextElementSibling;a.classList.toggle('show');btn.textContent=a.classList.contains('show')?'إخفاء الإجابة':'إظهار الإجابة'}
function mcq(btn){let card=btn.closest('.card'),buttons=[...card.querySelectorAll('.choice')];if(buttons.some(b=>b.classList.contains('correct')||b.classList.contains('wrong')))return;let ok=btn.dataset.correct==='true';btn.classList.add(ok?'correct':'wrong');card.querySelector('.feedback').textContent=ok?'✓ إجابة صحيحة':'✗ إجابة غير صحيحة — راجع الإجابة النموذجية أسفل السؤال.';card.querySelector('.answer').classList.add('show')}
function setTab(t){active=t;renderTabs();render()}
function resetAll(){active='الكل';query='';document.getElementById('search').value='';renderTabs();render()}
document.getElementById('search').addEventListener('input',e=>{query=e.target.value;render()});renderTabs();render();
</script>
